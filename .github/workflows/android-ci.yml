name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: ''

      - name: Install required Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test QA runner errors
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: QA source
        run: python3 tools/qa.py

      - name: Compile Android artifacts
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luciole-de-poche-verification
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
